<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enfolded</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; background: #07080f; color: #b0bcd0; font-family: 'Courier New', monospace; }
      :focus-visible { outline: 3px solid #e3bd73; outline-offset: 3px; }
      button:disabled { opacity: .55; cursor: default !important; }
      @media (max-width: 760px) {
        .world-layout { flex-direction: column; height: 100dvh !important; }
        .scene-view { flex: 0 0 32% !important; min-height: 150px; }
        .world-panel { flex: 1 1 auto !important; max-width: 100% !important; width: 100%; border-left: 0 !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
