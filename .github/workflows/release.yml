# Tag-triggered release builds (v0.1.0-qa.1 follow-up).
#
# qa.1's assets were built and uploaded by hand, so their provenance rested
# on the operator's word. From the next build on, pushing a release tag
# produces the release here: the FULL gate runs first (Ruff, the Python
# suite, Vitest, the production frontend build + committed-bundle freshness
# check, and the Playwright browser smoke — a tag can point at any commit,
# so this workflow cannot assume branch CI ever saw it), then ONE wheel is
# built and that exact artifact is smoke-tested, checksummed, and attached
# with machine-generated provenance notes — the published bytes and the
# verified bytes can never diverge.
#
# Version identity is one-to-one: a QA tag `v<base>-qa.<n>` requires the
# package version `<base>rc<n>` exactly (each QA build gets its own rc, no
# two tags can share a package identity), and a stable tag `v<x>` requires
# the stable package version `<x>` exactly. Anything else fails the run
# instead of shipping wrong metadata. The 0.1.x line starts at 0.1.1rc1:
# the hand-built qa.1 wheel already consumed 0.1.0 (see pyproject.toml).
#
# This publishes a downloadable artifact only — it creates no Fly
# application, volume, or parallel persistent world (ADR-007).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Gate, build, verify, and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install package with dev extras
        run: |
          pip install "setuptools==82.0.0"
          pip install --no-build-isolation -c requirements-dev.lock -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Run pytest
        # The default runner shell has no pipefail — without it, tee's exit
        # code would mask a failing suite and the release would still build.
        run: |
          set -o pipefail
          python -m pytest tests/ -q | tee pytest-summary.txt

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run JS tests
        run: npm test
        working-directory: frontend

      - name: Build the production bundle
        run: npm run build
        working-directory: frontend

      - name: Committed bundle is fresh
        # The wheel packages the committed static/app — a stale bundle here
        # would ship stale frontend bytes no matter what the build produced.
        run: |
          if [ -n "$(git status --porcelain -- static/app)" ]; then
            git status --porcelain -- static/app
            echo "::error::static/app is stale — run 'cd frontend && npm run build' and commit the result before tagging."
            exit 1
          fi

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run browser smoke tests
        run: npm run test:e2e
        working-directory: frontend

      - name: Build the release wheel
        run: |
          mkdir -p dist
          pip wheel --no-build-isolation --no-deps --wheel-dir dist .
          test "$(ls dist/enfolded-*.whl | wc -l)" = 1

      - name: Smoke-test the exact release artifact
        run: python scripts/verify_wheel.py dist/enfolded-*.whl

      - name: Checksum and stage assets
        run: |
          cp requirements.lock dist/
          cd dist
          sha256sum enfolded-*.whl > SHA256SUMS

      - name: Resolve release kind from tag and package version
        id: kind
        run: |
          WHEEL=$(basename dist/enfolded-*.whl)
          VERSION=$(echo "$WHEEL" | cut -d- -f2)
          TAG="$GITHUB_REF_NAME"
          if [ -z "${TAG##v*-qa.*}" ]; then
            # QA tag: v<base>-qa.<n> must carry package version <base>rc<n>
            # exactly — one tag, one package identity, never reused.
            BASE="${TAG#v}"; BASE="${BASE%%-qa.*}"
            SEQ="${TAG##*-qa.}"
            case "$SEQ" in
              ''|*[!0-9]*)
                echo "::error::QA tag $TAG must end in a numeric sequence (v<base>-qa.<n>)."
                exit 1 ;;
            esac
            if [ "$VERSION" != "${BASE}rc${SEQ}" ]; then
              echo "::error::QA tag $TAG requires package version ${BASE}rc${SEQ}, but the wheel is $VERSION — align pyproject.toml before tagging."
              exit 1
            fi
            KIND="QA build"; FLAGS="--prerelease"
          else
            # Stable tag: the package version must be stable and match the
            # tag exactly — catches tagging v0.1.1 while pyproject still
            # carries 0.1.1rcN. rc versions publish only through QA tags.
            case "$VERSION" in
              *rc*|*.dev*)
                echo "::error::tag $TAG built from prerelease package version $VERSION — prerelease wheels publish only via v<base>-qa.<n> tags."
                exit 1 ;;
            esac
            if [ "v$VERSION" != "$TAG" ]; then
              echo "::error::stable tag $TAG does not match package version $VERSION — align pyproject.toml before tagging."
              exit 1
            fi
            KIND="release"; FLAGS=""
          fi
          {
            echo "wheel=$WHEEL"
            echo "kind=$KIND"
            echo "flags=$FLAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Compose provenance notes
        env:
          WHEEL: ${{ steps.kind.outputs.wheel }}
          KIND: ${{ steps.kind.outputs.kind }}
        run: |
          DIGEST=$(cut -d' ' -f1 dist/SHA256SUMS)
          SIZE=$(stat -c%s "dist/$WHEEL")
          PYTESTS=$(grep -Eo '[0-9]+ passed' pytest-summary.txt | tail -1)
          cat > dist/BUILD_NOTES.md <<EOF
          # Enfolded $KIND $GITHUB_REF_NAME

          This is a downloadable artifact, not a hosted environment. It
          creates no Fly application, volume, or parallel persistent world.

          ## Provenance

          - Source: \`$GITHUB_REF_NAME\` at \`$GITHUB_SHA\`
          - Built by: this repository's Release workflow, run $GITHUB_RUN_ID
          - Artifact: \`$WHEEL\`
          - Size: $SIZE bytes
          - SHA-256: \`$DIGEST\`

          ## Verification (this workflow run)

          - Ruff lint green.
          - $PYTESTS (full Python suite).
          - Vitest suite green; production bundle built and byte-fresh
            against the committed static/app the wheel packages.
          - Playwright browser smoke green under the production CSP.
          - The exact attached wheel passed the installed-wheel smoke
            (packaging, migrations, frontend bundle, CLI entry point) —
            verified bytes and published bytes are the same file.

          ## Install and run

          Requires Python 3.11. The run command keeps the local world in a
          dedicated \`qa-home\` directory — your personal
          \`~/.nested-worlds\` database is never touched. Delete \`qa-home\`
          to reset that world; keep it to continue across runs.

          \`\`\`bash
          python3.11 -m venv .venv
          source .venv/bin/activate
          python -m pip install -c requirements.lock ./$WHEEL
          mkdir -p qa-home
          HOME="\$PWD/qa-home" python -m main serve --host 127.0.0.1 --port 8080
          \`\`\`

          Open \`http://127.0.0.1:8080/app\`.
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ steps.kind.outputs.kind }}
          FLAGS: ${{ steps.kind.outputs.flags }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/enfolded-*.whl dist/SHA256SUMS dist/requirements.lock dist/BUILD_NOTES.md \
            $FLAGS \
            --title "Enfolded $KIND $GITHUB_REF_NAME" \
            --notes-file dist/BUILD_NOTES.md
