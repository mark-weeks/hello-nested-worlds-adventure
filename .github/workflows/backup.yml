name: Off-host backup

# The volume holding worlds.db is the only live copy of the permanent
# chronicle; Fly's automatic snapshots retain just 5 days and live on the
# same platform. This schedule pulls an application-level backup off-host
# every 30 minutes into a private S3-compatible bucket. Cloudflare R2 is the
# documented default (docs/infrastructure/backup-bucket.md). The repository is
# public, and GitHub's artifact list is available to anyone with read access,
# so this workflow must never upload the database with actions/upload-artifact,
# including when validation fails or the bucket is not configured.
#
# Scheduling can be delayed or dropped; object freshness and a restore
# rehearsal establish readiness, not a green workflow badge. ADR-005's
# one-hour recovery target still applies. Litestream-style continuous
# replication remains the post-launch follow-up. Half-hourly full copies
# leave slack within that one-hour limit.
#
# Until FLY_API_TOKEN and the ENFOLDED_BACKUP_S3_* values are set, the gate
# leaves the job as an inactive no-op and uploads nothing. Before launch set
# ENFOLDED_BACKUP_REQUIRED=true: missing configuration then fails the job.
on:
  schedule:
    - cron: '17,47 * * * *'   # off the top-of-hour congestion
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: off-host-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ vars.ENFOLDED_BACKUP_APP || 'enfolded-beta' }}
      # Preserve typos so the gate can reject them instead of silently disabling backups.
      BACKUP_REQUIRED: ${{ vars.ENFOLDED_BACKUP_REQUIRED }}
      ENFOLDED_BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.ENFOLDED_BACKUP_S3_ACCESS_KEY_ID }}
      ENFOLDED_BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.ENFOLDED_BACKUP_S3_SECRET_ACCESS_KEY }}
      ENFOLDED_BACKUP_S3_BUCKET: ${{ vars.ENFOLDED_BACKUP_S3_BUCKET }}
      ENFOLDED_BACKUP_S3_ENDPOINT: ${{ vars.ENFOLDED_BACKUP_S3_ENDPOINT }}
      ENFOLDED_BACKUP_S3_REGION: ${{ vars.ENFOLDED_BACKUP_S3_REGION || 'auto' }}
      ENFOLDED_BACKUP_RETENTION_DAYS: ${{ vars.ENFOLDED_BACKUP_RETENTION_DAYS || '30' }}
      # Pinned installer zips. SHA-256 computed 2026-11-02 from those exact URLs.
      AWS_CLI_VERSION: '2.39.3'
      AWS_CLI_SHA256_X86_64: 14cb35809ad7547dd3c69fa9899a3975fbd850b6a6791f3fe264856490cd9a63
      AWS_CLI_SHA256_AARCH64: f6eb845fbacb11bee87de3f5fbe8043773cbe89d0414607b44b71e216eb9226b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check for the Fly token and the private bucket
        id: gate
        run: bash scripts/backup_gate.sh

      - name: Install AWS CLI
        id: aws
        if: steps.gate.outputs.ready == 'yes'
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          case "$arch" in
            x86_64) asset='linux-x86_64'; expect="$AWS_CLI_SHA256_X86_64" ;;
            aarch64|arm64) asset='linux-aarch64'; expect="$AWS_CLI_SHA256_AARCH64" ;;
            *) echo "::error::Unsupported runner architecture: $arch" >&2; exit 1 ;;
          esac
          workdir="$(mktemp -d)"
          curl -fsSL -o "$workdir/awscliv2.zip" \
            "https://awscli.amazonaws.com/awscli-exe-${asset}-${AWS_CLI_VERSION}.zip"
          echo "${expect}  $workdir/awscliv2.zip" | sha256sum -c -
          unzip -q "$workdir/awscliv2.zip" -d "$workdir"
          sudo "$workdir/aws/install" --update
          rm -rf "$workdir"
          aws --version | grep -F "aws-cli/${AWS_CLI_VERSION} "

      - name: Set up flyctl
        if: steps.gate.outputs.ready == 'yes'
        uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200 # master 2026-10-30

      - name: Take an online backup on the machine
        if: steps.gate.outputs.ready == 'yes'
        run: |
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          flyctl ssh console -a "$FLY_APP" -C \
            "python main.py backup --to /data/backups/offhost-$STAMP.db"

      - name: Download the backup off-host
        id: download
        if: steps.gate.outputs.ready == 'yes'
        run: |
          flyctl ssh sftp get "/data/backups/offhost-$STAMP.db" -a "$FLY_APP"
          ls -la "offhost-$STAMP.db"

      - name: Validate the downloaded SQLite snapshot
        id: validate
        if: steps.gate.outputs.ready == 'yes'
        run: python3 scripts/validate_backup.py "offhost-$STAMP.db"

      # Retain even an invalid snapshot for operator salvage, in the private
      # bucket only. Failed validation still fails the run. Quarantine names
      # never satisfy backup_health.py. There is no artifact upload.
      - name: Store the snapshot in the private bucket
        if: always() && steps.download.outcome == 'success' && steps.aws.outcome == 'success'
        run: |
          set -euo pipefail
          args=(python3 scripts/backup_store.py put --app "$FLY_APP" --stamp "$STAMP" --body "offhost-$STAMP.db")
          if [ "${{ steps.validate.outcome }}" != "success" ]; then
            args+=(--quarantine)
          fi
          key="$("${args[@]}")"
          echo "Stored ${key}" >> "$GITHUB_STEP_SUMMARY"

      - name: Prune private-bucket objects past retention
        if: always() && steps.gate.outputs.ready == 'yes' && steps.aws.outcome == 'success'
        run: python3 scripts/backup_store.py prune --app "$FLY_APP" --retention-days "$ENFOLDED_BACKUP_RETENTION_DAYS"

      - name: Prune old machine-local off-host copies
        if: always() && steps.gate.outputs.ready == 'yes'
        run: |
          flyctl ssh console -a "$FLY_APP" -C \
            "sh -c 'ls -t /data/backups/offhost-*.db 2>/dev/null | tail -n +7 | xargs -r rm'" \
            || echo "prune skipped"

      # Check freshness independently after run completion. This run cannot certify
      # its own successful conclusion; doing so would make first activation fail.
