name: Deploy staging

# Redeploys the disposable staging twin (ADR-005 section 2, runbook section
# 3a) and no other app. Agents and the owner can run it after a merge without
# the owner's machine. Production deploys stay where they are: the owner runs
# scripts/deploy.sh by hand.
#
# Four guards keep production out of reach:
#   1. The app name is written here, not taken from an input or a repository
#      variable, and the first step refuses any other value.
#   2. The deploy step names the staging app again when it calls deploy.sh.
#   3. The only secret is FLY_API_TOKEN_STAGING. The owner creates it as a
#      deploy token for the staging app alone (fly tokens create deploy -a
#      enfolded-staging). This file names no other token and no other app.
#   4. That token is the guard that does not depend on this file. A ref whose
#      scripts/deploy.sh ignored FLY_APP would still hold a token that, per
#      Fly's documentation, cannot act on another app. That scoping was not
#      verified from the session that wrote this workflow.
#
# Staging is declared disposable (ADR-004, 2026-10-25 amendment) and is torn
# down before launch. This workflow mints no invite keys: a key printed in a
# job log is a leaked credential. Mint keys from a terminal (runbook 3a).
#
# Manual dispatch only. Nothing here runs on push, on a schedule, or on a
# pull request.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit to deploy to staging'
        type: string
        required: false
        default: main
      first_deploy:
        description: 'First deploy only. No machine exists yet, so skip the chronicle backup.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# One staging deploy at a time. A second dispatch waits; it does not cancel
# a deploy that is already rolling.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy enfolded-staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      FLY_APP: enfolded-staging
      FLY_BIN: flyctl
    steps:
      - name: Refuse any app but the staging twin
        env:
          REF_INPUT: ${{ inputs.ref }}
          FIRST_DEPLOY: ${{ inputs.first_deploy }}
        run: |
          set -euo pipefail
          if [ "${FLY_APP-}" != "enfolded-staging" ]; then
            echo "::error::This workflow deploys only enfolded-staging. FLY_APP is something else. Refusing."
            exit 1
          fi
          if [[ ! "$REF_INPUT" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,254}$ || "$REF_INPUT" == *..* ]]; then
            echo "::error::ref must be a branch, tag or commit: letters, digits, '.', '_', '/' and '-', not starting with '-'."
            exit 1
          fi
          case "$FIRST_DEPLOY" in
            true|false) ;;
            *)
              echo "::error::first_deploy must be true or false."
              exit 1
              ;;
          esac
          echo "Target app: $FLY_APP"

      - name: Refuse without the staging deploy token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STAGING }}
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::error::The repository secret FLY_API_TOKEN_STAGING is not set. Create a deploy token for enfolded-staging only (fly tokens create deploy -a enfolded-staging) and store it under that name. See docs/infrastructure/fly-deployment.md section 3a."
            exit 1
          fi
          echo "FLY_API_TOKEN_STAGING is set."

      - name: Check out the ref to deploy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Record what is being deployed
        env:
          REF_INPUT: ${{ inputs.ref }}
          FIRST_DEPLOY: ${{ inputs.first_deploy }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "Deploying $REF_INPUT at $sha to $FLY_APP (first deploy: $FIRST_DEPLOY)"
          {
            echo "### Staging deploy"
            echo ""
            echo "- App: \`$FLY_APP\` (disposable staging twin)"
            echo "- Ref: \`$REF_INPUT\`"
            echo "- Commit: \`$sha\`"
            echo "- First deploy: $FIRST_DEPLOY"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200 # master 2026-10-30
        with:
          version: 0.5.1

      # deploy.sh backs up the staging chronicle first and refuses to deploy
      # over a failed backup, then checks the schema, prunes old backups and
      # runs fly deploy. With first_deploy it skips straight to fly deploy.
      - name: Deploy with scripts/deploy.sh
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STAGING }}
          FIRST_DEPLOY: ${{ inputs.first_deploy }}
        run: |
          set -euo pipefail
          # Checked again here, so a reordered step list cannot skip it.
          if [ "${FLY_APP-}" != "enfolded-staging" ]; then
            echo "::error::FLY_APP is not enfolded-staging. Refusing to deploy."
            exit 1
          fi
          args=()
          if [ "$FIRST_DEPLOY" = "true" ]; then
            args+=(--first-deploy)
          fi
          FLY_APP=enfolded-staging bash scripts/deploy.sh "${args[@]}"

      - name: Wait for staging /health
        env:
          HEALTH_URL: https://enfolded-staging.fly.dev/health
          HEALTH_ATTEMPTS: '30'
          HEALTH_INTERVAL_SECONDS: '10'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 "$HEALTH_ATTEMPTS"); do
            body="$(curl -fsS --max-time 10 "$HEALTH_URL" 2>/dev/null || true)"
            if printf '%s' "$body" | python3 -c 'import json, sys; data = json.loads(sys.stdin.read()); sys.exit(0 if isinstance(data, dict) and data.get("status") == "ok" else 1)' 2>/dev/null; then
              echo "Staging /health answered status ok on attempt $attempt."
              echo "- Health: ok on attempt $attempt" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" -lt "$HEALTH_ATTEMPTS" ]; then
              sleep "$HEALTH_INTERVAL_SECONDS"
            fi
          done
          echo "::error::Staging /health did not answer status ok in $HEALTH_ATTEMPTS attempts."
          echo "- Health: not ok after $HEALTH_ATTEMPTS attempts" >> "$GITHUB_STEP_SUMMARY"
          exit 1
