[build-system]
requires = ["setuptools==82.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enfolded"
# Pre-launch builds carry a PEP 440 prerelease version so QA wheel metadata
# can never be mistaken for (or shadow) the launch release. The hand-built
# v0.1.0-qa.1 wheel already published as 0.1.0, and PEP 440 orders a
# release candidate BEFORE its release (0.1.0rc1 < 0.1.0), so the line
# advances to 0.1.1: QA build N ships 0.1.1rcN (tag v0.1.1-qa.N — the
# release workflow enforces the one-to-one mapping), and the launch build
# bumps to plain "0.1.1".
version = "0.1.1rc1"
description = "Enfolded: Nested World Adventure — a shared persistent multiverse inhabited by human players and AI agents"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic>=0.40.0",
    "sentry-sdk>=2.0",
]

[project.scripts]
enfolded = "main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Real RFC 6455 client used as an executable conformance spec for the
    # hand-rolled /ws server (tests/test_ws_conformance.py). >=13 for the
    # sync client's recv(timeout=...) the test relies on.
    "websockets>=13",
    # Lint gate (CI runs `ruff check .`) — mechanical drift insurance for a
    # fresh-session-per-PR workflow.
    "ruff>=0.5",
]

[tool.setuptools]
py-modules = ["main", "merge_patch"]
packages = [
    "agents",
    "causality",
    "consciousness",
    "interface",
    "multiverse",
    "persistence",
    "puzzles",
    "server",
    "static",
]

[tool.setuptools.package-data]
persistence = ["migrations/*.sql"]
static = ["*.html", "*.js", "app/**/*", "easter-egg/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Default rule set (E4/E7/E9 + F): real defects and dead code only — no
# style bikeshedding. CI runs `ruff check .` alongside pytest.
extend-exclude = ["static"]

[tool.ruff.lint]
# Ruff's defaults have changed across releases. State the intended gate instead
# of allowing a tool upgrade to silently enable unrelated rule families.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Pure re-export shims: the package's public API is these imports.
"agents/__init__.py" = ["F401"]
"puzzles/__init__.py" = ["F401"]
# Pytest fixtures imported from sibling test modules are consumed via
# parameter injection, which ruff reads as an unused-then-shadowed name.
"tests/*" = ["F811"]
